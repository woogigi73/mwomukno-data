<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="걸어갈 수 있는 진짜 식당을 룰렛·사다리·해적 룰렛·경마로 골라 주는 친구·동료용 식당 고르기">
<meta name="theme-color" content="#FFC21A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뭐 먹노?">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=3">
<title>뭐 먹노?</title>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand">뭐 먹<b>노?</b></h1>
    <button class="area" id="areaBtn" aria-label="지역 고르기">지역 선택</button>
    <button class="smallbtn" id="searchBtn">검색</button>
    <button class="smallbtn" id="setBtn" aria-label="설정">⋯</button>
  </header>

  <section class="mapwrap" id="mapwrap">
    <canvas id="map" role="img" aria-label="도보 반경 지도"></canvas>
    <div class="maptop" id="journey"></div>
    <button class="locbtn" id="locBtn" aria-label="내 위치로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <div class="status" id="status" hidden></div>
    <div class="mapbot">
      <div class="radius" id="radius" role="group" aria-label="도보 반경"></div>
      <div class="count" id="count">후보 0곳</div>
    </div>
  </section>

  <section class="panel" id="panel">
    <div class="row">
      <div class="seg" role="group" aria-label="식사 시간"><button id="mLunch">점심</button><button id="mDinner">저녁</button></div>
      <button class="tog meal" id="tMeal"><i></i>밥</button>
      <button class="tog drink" id="tDrink"><i></i>술</button>
      <button class="tog cafe" id="tCafe"><i></i>카페</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="차수" id="rounds"></div>
      <button class="check" id="tExcl"><span class="box">✓</span>이번 주 간 곳 빼기</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="종류"></div>
    <div class="next" id="next" hidden></div>
    <div class="games" id="games"></div>
  </section>
</div>

<div class="overlay" id="game" hidden>
  <div class="ov-head">
    <div><div class="eyebrow" id="gHead"></div><h2 id="gTitle"></h2></div>
    <span class="sp"></span>
    <button class="btn sm sound" id="gSound" aria-label="효과음 끄기">🔊</button>
    <button class="btn sm" id="gClose">닫기</button>
  </div>
  <div class="ov-body">
    <div class="stage" id="stage"></div>
    <div class="result" id="result" hidden></div>
  </div>
</div>

<div id="sheetRoot"></div>
<div id="bannerRoot"></div>

<div class="onb" id="onb" hidden>
  <div class="onb-in">
    <h1>뭐 먹<b>노?</b></h1>
    <p>걸어갈 수 있는 진짜 식당 중에서<br>게임으로 정해 드려요</p>
    <ul>
      <li>도보 5·10·15·20분 안의 영업 중인 식당</li>
      <li>룰렛·사다리·해적 룰렛·경마·월드컵·폭탄 돌리기</li>
      <li>1차 → 2차 → 3차, 이번 주 간 곳은 자동 제외</li>
      <li>위치는 이 폰 안에서만 쓰고 어디에도 보내지 않아요</li>
    </ul>
    <button class="btn primary big" id="onbLoc">내 위치로 시작하기</button>
    <button class="btn" id="onbPick">지역 직접 고르기</button>
  </div>
</div>

<noscript><p>자바스크립트를 켜야 쓸 수 있어요.</p></noscript>
<script src="fx.js?v=3" defer></script>
<script src="app.js?v=3" defer></script>
</body>
</html>
